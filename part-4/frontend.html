<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask API Frontend Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: #0f3460;
            border: none;
            color: #eee;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e94560;
            transform: translateY(-2px);
        }

        .tab.active {
            background: #e94560;
        }

        .tab-content {
            display: none;
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e94560;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #0f3460;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn:hover {
            background: #d63950;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: #27ae60;
        }

        .btn-secondary:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f3460;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #e94560;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #16213e;
        }

        tr:hover {
            background: #1a2942;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #27ae60;
            color: white;
        }

        .message.error {
            background: #e74c3c;
            color: white;
        }

        .message.show {
            display: block;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #0f3460;
            border-radius: 8px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Flask API Manager</h1>

        <div class="tabs">
            <button class="tab active" onclick="showTab('books')">Books</button>
            <button class="tab" onclick="showTab('authors')">Authors</button>
            <button class="tab" onclick="showTab('create-book')">Add Book</button>
            <button class="tab" onclick="showTab('create-author')">Add Author</button>
        </div>

        <!-- Books Tab -->
        <div id="books" class="tab-content active">
            <h2>📖 Books Management</h2>
            <div id="books-message" class="message"></div>

            <div class="filters">
                <div>
                    <label>Search Title:</label>
                    <input type="text" id="search-title" placeholder="Search books...">
                </div>
                <div>
                    <label>Filter by Year:</label>
                    <input type="number" id="filter-year" placeholder="e.g., 2020">
                </div>
                <div>
                    <label>Sort By:</label>
                    <select id="sort-field">
                        <option value="id">ID</option>
                        <option value="title">Title</option>
                        <option value="year">Year</option>
                        <option value="created_at">Date Added</option>
                    </select>
                </div>
                <div>
                    <label>Order:</label>
                    <select id="sort-order">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>
                <div style="align-self: end;">
                    <button class="btn btn-secondary" onclick="loadBooks()">Apply Filters</button>
                </div>
            </div>

            <div id="books-loading" class="loading" style="display: none;">Loading books...</div>
            <div class="table-container">
                <table id="books-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Year</th>
                            <th>ISBN</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="books-tbody"></tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="btn btn-small" onclick="prevPage()" id="prev-btn">Previous</button>
                <span id="page-info">Page 1</span>
                <button class="btn btn-small" onclick="nextPage()" id="next-btn">Next</button>
            </div>
        </div>

        <!-- Authors Tab -->
        <div id="authors" class="tab-content">
            <h2>👤 Authors Management</h2>
            <div id="authors-message" class="message"></div>
            <div id="authors-loading" class="loading" style="display: none;">Loading authors...</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>City</th>
                            <th>Books Count</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="authors-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Create Book Tab -->
        <div id="create-book" class="tab-content">
            <h2>➕ Add New Book</h2>
            <div id="create-book-message" class="message"></div>
            <form id="create-book-form" onsubmit="createBook(event)">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="book-title" required>
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <select id="book-author"></select>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="book-year" min="1000" max="2100">
                </div>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" id="book-isbn">
                </div>
                <button type="submit" class="btn">Create Book</button>
            </form>
        </div>

        <!-- Create Author Tab -->
        <div id="create-author" class="tab-content">
            <h2>➕ Add New Author</h2>
            <div id="create-author-message" class="message"></div>
            <form id="create-author-form" onsubmit="createAuthor(event)">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="author-name" required>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="author-bio"></textarea>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="author-city">
                </div>
                <button type="submit" class="btn">Create Author</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let currentPage = 1;
        const perPage = 5;

        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'books') loadBooks();
            if (tabName === 'authors') loadAuthors();
            if (tabName === 'create-book') loadAuthorsForSelect();
        }

        // Load books with filters, sorting, and pagination
        async function loadBooks() {
            const loading = document.getElementById('books-loading');
            loading.style.display = 'block';

            const searchTitle = document.getElementById('search-title').value;
            const filterYear = document.getElementById('filter-year').value;
            const sortField = document.getElementById('sort-field').value;
            const sortOrder = document.getElementById('sort-order').value;

            let url = `${API_URL}/books-advanced?page=${currentPage}&per_page=${perPage}&sort=${sortField}&order=${sortOrder}`;
            
            if (searchTitle) url += `&q=${searchTitle}`;
            if (filterYear) url += `&year=${filterYear}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    displayBooks(data.books);
                    updatePagination(data);
                }
            } catch (error) {
                showMessage('books-message', 'Error loading books', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayBooks(books) {
            const tbody = document.getElementById('books-tbody');
            tbody.innerHTML = '';

            if (books.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No books found</td></tr>';
                return;
            }

            books.forEach(book => {
                const row = `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author_name || 'N/A'}</td>
                        <td>${book.year || 'N/A'}</td>
                        <td>${book.isbn || 'N/A'}</td>
                        <td class="action-buttons">
                            <button class="btn btn-small btn-secondary" onclick="editBook(${book.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteBook(${book.id})">Delete</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function updatePagination(data) {
            document.getElementById('page-info').textContent = `Page ${data.page} of ${data.total_pages} (${data.total} total)`;
            document.getElementById('prev-btn').disabled = !data.has_prev;
            document.getElementById('next-btn').disabled = !data.has_next;
        }

        function nextPage() {
            currentPage++;
            loadBooks();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadBooks();
            }
        }

        // Load authors
        async function loadAuthors() {
            const loading = document.getElementById('authors-loading');
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/authors`);
                const data = await response.json();
                
                if (data.success) {
                    displayAuthors(data.authors);
                }
            } catch (error) {
                showMessage('authors-message', 'Error loading authors', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayAuthors(authors) {
            const tbody = document.getElementById('authors-tbody');
            tbody.innerHTML = '';

            if (authors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No authors found</td></tr>';
                return;
            }

            authors.forEach(author => {
                const row = `
                    <tr>
                        <td>${author.id}</td>
                        <td>${author.name}</td>
                        <td>${author.city || 'N/A'}</td>
                        <td>${author.books_count}</td>
                        <td class="action-buttons">
                            <button class="btn btn-small btn-secondary" onclick="editAuthor(${author.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteAuthor(${author.id})">Delete</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Load authors for select dropdown
        async function loadAuthorsForSelect() {
            try {
                const response = await fetch(`${API_URL}/authors`);
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('book-author');
                    select.innerHTML = '<option value="">Select Author (Optional)</option>';
                    
                    data.authors.forEach(author => {
                        select.innerHTML += `<option value="${author.id}">${author.name}</option>`;
                    });
                }
            } catch (error) {
                console.error('Error loading authors for select:', error);
            }
        }

        // Create book
        async function createBook(event) {
            event.preventDefault();

            const bookData = {
                title: document.getElementById('book-title').value,
                year: parseInt(document.getElementById('book-year').value) || null,
                isbn: document.getElementById('book-isbn').value || null,
                author_id: parseInt(document.getElementById('book-author').value) || null
            };

            try {
                const response = await fetch(`${API_URL}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('create-book-message', 'Book created successfully!', 'success');
                    document.getElementById('create-book-form').reset();
                    setTimeout(() => showTab('books'), 1500);
                } else {
                    showMessage('create-book-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('create-book-message', 'Error creating book', 'error');
            }
        }

        // Create author
        async function createAuthor(event) {
            event.preventDefault();

            const authorData = {
                name: document.getElementById('author-name').value,
                bio: document.getElementById('author-bio').value || null,
                city: document.getElementById('author-city').value || null
            };

            try {
                const response = await fetch(`${API_URL}/authors`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(authorData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('create-author-message', 'Author created successfully!', 'success');
                    document.getElementById('create-author-form').reset();
                    setTimeout(() => showTab('authors'), 1500);
                } else {
                    showMessage('create-author-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('create-author-message', 'Error creating author', 'error');
            }
        }

        // Delete book
        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) return;

            try {
                const response = await fetch(`${API_URL}/books/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('books-message', 'Book deleted successfully!', 'success');
                    loadBooks();
                } else {
                    showMessage('books-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('books-message', 'Error deleting book', 'error');
            }
        }

        // Delete author
        async function deleteAuthor(id) {
            if (!confirm('Are you sure you want to delete this author? This will also delete all their books!')) return;

            try {
                const response = await fetch(`${API_URL}/authors/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('authors-message', 'Author deleted successfully!', 'success');
                    loadAuthors();
                } else {
                    showMessage('authors-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('authors-message', 'Error deleting author', 'error');
            }
        }

        // Edit functions (simplified - just alerts for now)
        function editBook(id) {
            const newTitle = prompt('Enter new title:');
            if (newTitle) {
                fetch(`${API_URL}/books/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showMessage('books-message', 'Book updated!', 'success');
                        loadBooks();
                    }
                });
            }
        }

        function editAuthor(id) {
            const newName = prompt('Enter new name:');
            if (newName) {
                fetch(`${API_URL}/authors/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showMessage('authors-message', 'Author updated!', 'success');
                        loadAuthors();
                    }
                });
            }
        }

        // Show messages
        function showMessage(elementId, message, type) {
            const msgEl = document.getElementById(elementId);
            msgEl.textContent = message;
            msgEl.className = `message ${type} show`;
            setTimeout(() => msgEl.classList.remove('show'), 3000);
        }

        // Initialize on page load
        window.onload = () => {
            loadBooks();
        };
    </script>
</body>
</html>
